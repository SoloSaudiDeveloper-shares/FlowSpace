<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowSpace clipper settings</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 20px;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 { font-size: 18px; }
      label { display: block; font-size: 12px; margin: 16px 0 4px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #1e293b;
        color: #e2e8f0;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 12px;
        box-sizing: border-box;
      }
      button {
        margin-top: 20px;
        padding: 10px 16px;
        background: #a78bfa;
        color: #0f172a;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      #saved { color: #6ee7b7; font-size: 13px; margin-left: 10px; }
      p.help { font-size: 12px; opacity: 0.7; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>FlowSpace Web Clipper</h1>
    <p class="help">
      Paste your FlowSpace URL and an API token issued from
      Settings → Account → API tokens.
    </p>
    <label for="baseUrl">FlowSpace URL</label>
    <input id="baseUrl" placeholder="https://your-flowspace.example.com" />
    <label for="token">API token</label>
    <input id="token" placeholder="flws_…" type="password" />
    <button id="save">Save</button>
    <span id="saved" hidden>Saved ✓</span>
    <script src="options.js"></script>
  </body>
</html>
