<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowSpace clipper</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        width: 240px;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 { font-size: 13px; margin: 0 0 8px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
      button {
        width: 100%;
        padding: 8px 12px;
        background: #a78bfa;
        color: #0f172a;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status { margin-top: 10px; font-size: 11px; opacity: 0.8; }
      a { color: #67e8f9; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Clip to FlowSpace</h1>
    <button id="go">Save this page</button>
    <p id="status"></p>
    <a href="#" id="opt">Settings</a>
    <script src="popup.js"></script>
  </body>
</html>
